<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span><span>✧</span>
  </div>

  <div class="app">
    <section class="stage">
      <svg id="mascot" class="mascot" viewBox="0 0 160 180" role="button" tabindex="0" aria-label="할 일 뽑기: 캐릭터를 누르면 먼저 할 일을 골라 줘요">
        <title>저를 누르면 먼저 할 일을 뽑아 줄게요!</title>
        <defs>
          <clipPath id="mascot-face-clip"><path d="M48 70 C48 50 62 39 80 39 C98 39 112 50 112 70 C112 94 105 111 93 119 Q80 127 67 119 C55 111 48 94 48 70 Z" /></clipPath>
          <clipPath id="mascot-dress-clip"><path d="M36 180 C37 152 50 137 69 133 Q80 141 91 133 C110 137 123 152 124 180 Z" /></clipPath>
        </defs>
        <!-- 뒷머리: 어깨 아래까지 내려오는 긴 머리 -->
        <path class="hair-back" d="M80 18 C44 18 30 46 31 82 C32 114 27 140 20 162 C38 170 56 164 64 150 L96 150 C104 164 122 170 140 162 C133 140 128 114 129 82 C130 46 116 18 80 18 Z" />
        <!-- 몸 -->
        <path class="dress" d="M36 180 C37 152 50 137 69 133 Q80 141 91 133 C110 137 123 152 124 180 Z" />
        <!-- 옷 음영: 가장자리를 어둡게, 팔과 몸의 경계와 주름 -->
        <g clip-path="url(#mascot-dress-clip)">
          <path class="dress-shade" d="M30 180 C34 156 44 142 58 136 C52 150 50 166 52 180 Z" />
          <path class="dress-shade" d="M130 180 C126 156 116 142 102 136 C108 150 110 166 108 180 Z" />
          <path class="dress-shade" d="M66 131 Q80 146 94 131 L96 140 Q80 154 64 140 Z" />
        </g>
        <path class="fold" d="M53 150 Q50 165 50 180" />
        <path class="fold" d="M107 150 Q110 165 110 180" />
        <!-- 목 -->
        <path class="skin" d="M71 108 L71 129 Q80 136 89 129 L89 108 Z" />
        <path class="skin-shade" d="M71 112 Q80 124 89 112 L89 108 L71 108 Z" />
        <!-- V넥 가디건 안의 흰 셔츠 -->
        <path class="collar" d="M69 133 Q80 141 91 133 L80 151 Z" />
        <path class="fold" d="M69 133 L80 151 L91 133" />
        <!-- 귀 -->
        <ellipse class="skin" cx="48" cy="83" rx="5" ry="8" />
        <ellipse class="skin" cx="112" cy="83" rx="5" ry="8" />
        <!-- 얼굴: 갸름한 턱선 -->
        <path class="skin" d="M48 70 C48 50 62 39 80 39 C98 39 112 50 112 70 C112 94 105 111 93 119 Q80 127 67 119 C55 111 48 94 48 70 Z" />
        <!-- 얼굴 음영: 앞머리 그림자, 턱 아래와 양옆 -->
        <g clip-path="url(#mascot-face-clip)">
          <path class="face-shade" d="M44 78 C39 43 56 20 80 20 C104 20 121 43 116 78 C113 66 109 58 103 53 C101 61 95 66 88 68 C90 60 89 54 85 49 C81 58 73 64 62 66 C66 60 66 55 64 51 C58 57 51 66 44 78 Z" transform="translate(0 3.5)" />
          <path class="face-shade" d="M44 80 C46 100 56 114 68 120 L60 124 L40 124 Z" />
          <path class="face-shade" d="M116 80 C114 100 104 114 92 120 L100 124 L120 124 Z" />
        </g>
        <ellipse class="cheek-light" cx="62" cy="93" rx="4" ry="2" />
        <ellipse class="cheek-light" cx="98" cy="93" rx="4" ry="2" />
        <!-- 볼터치 -->
        <ellipse class="blush" cx="59" cy="97" rx="7" ry="3.5" />
        <ellipse class="blush" cx="101" cy="97" rx="7" ry="3.5" />
        <!-- 눈썹 -->
        <path class="brow" d="M58 67.5 Q64.5 63.5 71 66" />
        <path class="brow" d="M89 66 Q95.5 63.5 102 67.5" />
        <!-- 기본 눈: 흰자, 홍채, 동공, 반짝임, 속눈썹 -->
        <g class="eyes-open">
          <g transform="translate(0 83) scale(1 0.86) translate(0 -83)">
          <ellipse class="sclera" cx="65" cy="82.5" rx="7.4" ry="8.6" />
          <ellipse class="sclera" cx="95" cy="82.5" rx="7.4" ry="8.6" />
          <ellipse class="iris" cx="65.4" cy="83" rx="6" ry="7.8" />
          <ellipse class="iris" cx="94.6" cy="83" rx="6" ry="7.8" />
          <path class="iris-shade" d="M59.4 81.5 A6 7.8 0 0 1 71.4 81.5 Q65.4 78.5 59.4 81.5 Z" />
          <path class="iris-shade" d="M88.6 81.5 A6 7.8 0 0 1 100.6 81.5 Q94.6 78.5 88.6 81.5 Z" />
          <ellipse class="pupil" cx="65.4" cy="83.6" rx="2.6" ry="3.6" />
          <ellipse class="pupil" cx="94.6" cy="83.6" rx="2.6" ry="3.6" />
          <circle class="shine" cx="68" cy="79.6" r="2.4" />
          <circle class="shine" cx="97.6" cy="79.6" r="2.4" />
          <circle class="shine" cx="63" cy="87" r="1.1" />
          <circle class="shine" cx="92.6" cy="87" r="1.1" />
          <path class="lash" d="M72.5 78 Q65 70.5 57 76.5 L54.5 74.5" />
          <path class="lash" d="M87.5 78 Q95 70.5 103 76.5 L105.5 74.5" />
          <path class="lash-lower" d="M59 90 Q65 92.5 71 89.5" />
          <path class="lash-lower" d="M101 90 Q95 92.5 89 89.5" />
          </g>
        </g>
        <!-- 웃는 눈 -->
        <g class="eyes-happy">
          <path class="lash" d="M57 84 Q65 75 73 84" />
          <path class="lash" d="M87 84 Q95 75 103 84" />
        </g>
        <!-- 코 -->
        <path class="nose" d="M80.5 91 Q79 95 81.5 96" />
        <!-- 입 -->
        <path class="line mouth-idle" d="M75.5 103 Q80 106.5 84.5 103" />
        <path class="mouth-happy" d="M73.5 101 Q80 111 86.5 101 Q80 103 73.5 101 Z" />
        <!-- 옆머리 -->
        <path class="hair" d="M49 60 C43 82 44 104 39 124 C48 118 53 100 53 82 Z" />
        <path class="hair" d="M111 60 C117 82 116 104 121 124 C112 118 107 100 107 82 Z" />
        <!-- 앞머리: 갈래가 나뉜 자연스러운 앞머리 -->
        <path class="hair" d="M44 78 C39 43 56 20 80 20 C104 20 121 43 116 78 C113 66 109 58 103 53 C101 61 95 66 88 68 C90 60 89 54 85 49 C81 58 73 64 62 66 C66 60 66 55 64 51 C58 57 51 66 44 78 Z" />
        <!-- 머리 안쪽 그늘: 정수리 가르마와 앞머리 갈래 사이 -->
        <path class="hair-shade" d="M80 22 C76 34 74 46 72 60 C77 54 81 48 85 49 C84 38 82 30 80 22 Z" />
        <path class="hair-shade" d="M103 53 C106 44 106 36 102 30 C108 38 113 50 116 78 C113 66 109 58 103 53 Z" />
        <!-- 머리 윤기 -->
        <path class="hair-shine" d="M58 36 Q70 27 86 28" />
        <path class="hair-shine" d="M94 30 Q101 32 106 37" />
        <!-- 머리핀 리본 -->
        <g class="ribbon">
          <path d="M108 34 L120 24 L121 41 Z" />
          <path d="M108 34 L97 26 L98 42 Z" />
          <circle cx="108" cy="34" r="3.6" />
        </g>
      </svg>
      <div id="bubble" class="bubble" aria-live="polite">오늘은 뭘 할까요?</div>
    </section>

    <main class="card">
      <header class="card-header">
        <h1>오늘 할 일</h1>
        <span id="counter" class="counter">0/0 완료</span>
      </header>

      <label class="author-field">
        내 이름
        <input id="author-input" type="text" placeholder="안 적어도 돼요" maxlength="30" autocomplete="name">
      </label>

      <div class="progress" role="progressbar" aria-label="완료율" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
        <input id="due-input" type="date" aria-label="마감일 (안 정해도 돼요)" title="마감일 (안 정해도 돼요)">
        <button type="submit" aria-label="할 일 추가">+</button>
      </form>

      <p id="error" class="error" role="alert" hidden></p>

      <div class="filter-bar">
        <div class="filters" role="group" aria-label="보기 선택">
          <button type="button" class="filter" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="filter" data-filter="active" aria-pressed="false">진행 중</button>
          <button type="button" class="filter" data-filter="done" aria-pressed="false">완료</button>
        </div>
        <span id="remaining" class="remaining" aria-live="polite"></span>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty">할 일이 없어요. 위에 입력해 보세요!</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
