<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span><span>✧</span>
  </div>

  <div class="app">
    <section class="stage">
      <svg id="mascot" class="mascot" viewBox="0 0 160 180" role="img" aria-label="응원하는 캐릭터">
        <!-- 트윈테일 -->
        <ellipse class="hair" cx="24" cy="92" rx="17" ry="40" transform="rotate(12 24 92)" />
        <ellipse class="hair" cx="136" cy="92" rx="17" ry="40" transform="rotate(-12 136 92)" />
        <!-- 뒷머리 -->
        <circle class="hair" cx="80" cy="72" r="56" />
        <!-- 몸 -->
        <path class="dress" d="M48 142 Q80 124 112 142 L124 180 L36 180 Z" />
        <path class="collar" d="M66 134 L80 148 L94 134 Z" />
        <!-- 얼굴 -->
        <ellipse class="skin" cx="80" cy="82" rx="46" ry="44" />
        <!-- 앞머리 -->
        <path class="hair" d="M34 76 Q38 28 80 26 Q122 28 126 76 Q112 54 100 62 Q92 44 80 60 Q68 44 60 62 Q48 54 34 76 Z" />
        <!-- 리본 -->
        <g class="ribbon">
          <path d="M118 34 L134 20 L133 44 Z" />
          <path d="M118 34 L102 20 L103 44 Z" />
          <circle cx="118" cy="34" r="5" />
        </g>
        <!-- 기본 눈 -->
        <g class="eyes-open">
          <ellipse class="iris" cx="62" cy="90" rx="8" ry="11" />
          <ellipse class="iris" cx="98" cy="90" rx="8" ry="11" />
          <circle class="shine" cx="65" cy="85" r="3" />
          <circle class="shine" cx="101" cy="85" r="3" />
          <circle class="shine" cx="59" cy="95" r="1.5" />
          <circle class="shine" cx="95" cy="95" r="1.5" />
        </g>
        <!-- 웃는 눈 -->
        <g class="eyes-happy">
          <path class="line" d="M53 92 Q62 80 71 92" />
          <path class="line" d="M89 92 Q98 80 107 92" />
        </g>
        <!-- 볼터치 -->
        <ellipse class="blush" cx="50" cy="104" rx="7" ry="4" />
        <ellipse class="blush" cx="110" cy="104" rx="7" ry="4" />
        <!-- 입 -->
        <path class="line mouth-idle" d="M74 108 Q80 113 86 108" />
        <path class="mouth-happy" d="M71 105 Q80 119 89 105 Z" />
      </svg>
      <div id="bubble" class="bubble" aria-live="polite">오늘은 뭘 할까요?</div>
    </section>

    <main class="card">
      <header class="card-header">
        <h1>오늘 할 일</h1>
        <span id="counter" class="counter">0/0 완료</span>
      </header>

      <label class="author-field">
        내 이름
        <input id="author-input" type="text" placeholder="안 적어도 돼요" maxlength="30" autocomplete="name">
      </label>

      <div class="progress" role="progressbar" aria-label="완료율" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
        <input id="due-input" type="date" aria-label="마감일 (안 정해도 돼요)" title="마감일 (안 정해도 돼요)">
        <button type="submit" aria-label="할 일 추가">+</button>
      </form>

      <p id="error" class="error" role="alert" hidden></p>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty">할 일이 없어요. 위에 입력해 보세요!</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
